<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="home" class="screen">
        <h1>Darts counting</h1>
        <p>Pick how many darts to add up each turn.</p>
        <div id="modes">
            <button data-darts="1">1 dart</button>
            <button data-darts="2">2 darts</button>
            <button data-darts="3">3 darts</button>
        </div>
    </main>

    <dialog id="options">
        <form method="dialog">
            <h2 id="options-title">1 dart</h2>
            <fieldset>
                <legend>Include</legend>
                <label><input type="checkbox" name="singles" checked> Singles <small>(and 25)</small></label>
                <label><input type="checkbox" name="doubles" checked> Doubles <small>(and bull)</small></label>
                <label><input type="checkbox" name="triples" checked> Triples</label>
            </fieldset>
            <fieldset>
                <legend id="count-legend">Darts</legend>
                <div class="choices">
                    <label><input type="radio" name="count" value="5"> 5</label>
                    <label><input type="radio" name="count" value="10" checked> 10</label>
                    <label><input type="radio" name="count" value="20"> 20</label>
                    <label><input type="radio" name="count" value="50"> 50</label>
                </div>
            </fieldset>
            <p id="options-error" class="error" hidden>Include at least one of singles, doubles or triples.</p>
            <div class="actions">
                <button value="cancel" formnovalidate>Cancel</button>
                <button value="ok" class="primary">OK</button>
            </div>
        </form>
    </dialog>

    <div id="game" class="container screen" hidden>
        <header id="game-bar">
            <button id="quit" aria-label="Back to menu">✕</button>
            <span id="progress"></span>
            <span id="tally"></span>
        </header>

        <div id="board">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>

        <div id="number-pad">
            <div id="pad-display" aria-live="polite"></div>
            <div id="pad-keys">
                <button data-digit="1">1</button>
                <button data-digit="2">2</button>
                <button data-digit="3">3</button>
                <button data-digit="4">4</button>
                <button data-digit="5">5</button>
                <button data-digit="6">6</button>
                <button data-digit="7">7</button>
                <button data-digit="8">8</button>
                <button data-digit="9">9</button>
                <button id="pad-delete" aria-label="Delete">⌫</button>
                <button data-digit="0">0</button>
                <button id="pad-enter">Enter</button>
            </div>
        </div>
    </div>

    <main id="results" class="screen" hidden>
        <h1>Done</h1>
        <p id="results-score"></p>
        <ul id="results-misses"></ul>
        <div class="actions">
            <button id="menu">Menu</button>
            <button id="again" class="primary">Play again</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
